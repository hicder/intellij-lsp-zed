name: Monitor extension health

on:
  schedule:
    # Weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce extension runtime logic
        id: check
        run: |
          set -e
          TMP=$(mktemp -d)
          cd "$TMP"

          echo "== Step 1: Fetch Open VSX API =="
          curl -fsSL -o meta.json "https://open-vsx.org/api/JetBrains/intellij-server/latest" \
            || { echo "FAILED: Open VSX API unreachable"; exit 1; }
          VSIX_URL=$(python3 -c "
import json
m = json.load(open('meta.json'))
print(m.get('files', {}).get('download', '') or m.get('download', ''))
" )
          [ -n "$VSIX_URL" ] || { echo "FAILED: no VSIX download URL in API response"; exit 1; }
          echo "VSIX URL: $VSIX_URL"

          echo "== Step 2: Download and extract VSIX =="
          curl -fsSL -o vsix.zip "$VSIX_URL" || { echo "FAILED: VSIX download"; exit 1; }
          unzip -q vsix.zip -d vsix || { echo "FAILED: VSIX extraction"; exit 1; }
          [ -f "vsix/extension/server-bundle.json" ] || { echo "FAILED: server-bundle.json missing"; exit 1; }

          echo "== Step 3: Read server-bundle.json =="
          SERVER_URL=$(python3 -c "
import json
b = json.load(open('vsix/extension/server-bundle.json'))
print(b['url'])
" ) || { echo "FAILED: bad server-bundle.json"; exit 1; }
          VERSION=$(python3 -c "
import json
b = json.load(open('vsix/extension/server-bundle.json'))
print(b['version'])
" )
          echo "Server version: $VERSION"
          echo "Server URL: $SERVER_URL"

          echo "== Step 4: Verify server URL responds =="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 60 "$SERVER_URL")
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAILED: server URL returned $STATUS"; exit 1; }

          echo "== All checks passed =="
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Close stale health issues
        if: steps.check.outputs.version != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extension-broken'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Health check passed — this issue is being closed automatically.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

      - name: Open issue if broken
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'extension-broken'
            });
            if (issues.data.length > 0) {
              console.log('Issue already open — skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Extension health check failed — server download chain broken',
              body: `The weekly health check failed. This means the extension will not be able to auto-download the IntelliJ LSP server.

            **Possible causes:**
            - JetBrains changed the Open VSX API response format
            - The VSIX structure changed (server-bundle.json moved/renamed)
            - The JetBrains CDN URL pattern changed
            - Server bundle requires a different download method

            **Run the failing step locally to see the error:**
            \`\`\`sh
            curl -sL "https://open-vsx.org/api/JetBrains/intellij-server/latest"
            \`\`\`

            **Fix:** update \`src/lib.rs\` accordingly, rebuild, and release.`,
              labels: ['extension-broken']
            });
