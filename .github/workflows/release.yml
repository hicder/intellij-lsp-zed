name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build extension
        run: cargo build --release --target wasm32-wasip2

      - name: Prepare release artifacts
        run: |
          cp target/wasm32-wasip2/release/intellij_lsp_zed.wasm extension.wasm
          cp extension.toml extension.wasm README.md LICENSE scripts/install.sh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension.wasm
            extension.toml
          body: |
            ## Install

            ### Option 1: From Zed extension registry
            Open Zed → `Cmd+Shift+P` → `zed: extensions` → search "IntelliJ LSP"

            ### Option 2: Manual install
            ```sh
            mkdir -p ~/Library/Application\ Support/Zed/extensions/installed/intellij-lsp-zed/
            cp extension.wasm extension.toml ~/Library/Application\ Support/Zed/extensions/installed/intellij-lsp-zed/
            ```
            (On Linux: `~/.local/share/zed/extensions/installed/`)

            ## Server

            The extension requires the IntelliJ LSP server. Run:
            ```sh
            ./scripts/install.sh
            ```
            Or download it manually from the link above.
          generate_release_notes: true
