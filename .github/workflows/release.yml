name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build extension
        run: cargo build --release --target wasm32-wasip2

      - name: Prepare artifacts
        run: |
          cp target/wasm32-wasip2/release/intellij_lsp_zed.wasm extension.wasm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension.wasm
            extension.toml
          generate_release_notes: true

  update-extensions-registry:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update submodule in zed-industries/extensions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.EXTENSIONS_REPO_PAT }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const owner = 'hlucas13';
            const extRepo = 'intellij-lsp-zed';
            const registryOwner = 'zed-industries';
            const registryRepo = 'extensions';
            const extPath = `extensions/${extRepo}`;

            // Clone the extensions registry repo
            const { execSync } = require('child_process');
            execSync(`git clone https://x-access-token:${process.env.GH_TOKEN}@github.com/${owner}/${registryRepo}.git /tmp/extensions`, { stdio: 'inherit' });
            process.chdir('/tmp/extensions');

            // Configure git
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            // Add/update submodule
            const branchName = `update-${extRepo}-${tag}`;
            execSync(`git checkout -b ${branchName}`);
            execSync(`git submodule add -b main https://github.com/${owner}/${extRepo}.git ${extPath} || true`);
            execSync(`cd ${extPath} && git fetch origin tag ${tag} && git checkout ${tag}`);

            // Commit and push
            execSync('git add .');
            execSync(`git commit -m "chore: update ${extRepo} to ${tag}"`);

            const result = execSync(`git push https://x-access-token:${process.env.GH_TOKEN}@github.com/${owner}/${registryRepo}.git ${branchName} 2>&1`, { encoding: 'utf8' });
            console.log('Push result:', result);

            // Auto-merge PR since we're using our own fork
            console.log(`Branch pushed: ${branchName}`);
            console.log(`Open a PR at: https://github.com/${owner}/${registryRepo}/compare/main...${owner}:${branchName}`);
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_REPO_PAT }}
