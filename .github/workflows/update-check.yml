name: Check for server updates

on:
  schedule:
    # Run every Monday at 8am UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest VSIX metadata
        id: vsix
        run: |
          RESPONSE=$(curl -sL "https://open-vsx.org/api/JetBrains/intellij-server/latest")
          VERSION=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('version','unknown'))" 2>/dev/null || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check installed version
        id: check
        run: |
          LATEST="${{ steps.vsix.outputs.version }}"
          echo "Latest server version: $LATEST"

          # Check if we have a record of the last known version
          if [ -f .last-server-version ]; then
            CURRENT=$(cat .last-server-version)
          else
            CURRENT="none"
          fi

          echo "Current tracked version: $CURRENT"

          if [ "$LATEST" != "$CURRENT" ] && [ "$LATEST" != "unknown" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$LATEST" > .last-server-version
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for new server version
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.vsix.outputs.version }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New IntelliJ LSP server build: ${version}`,
              body: `A new server build (${version}) is available on Open VSX.

            **Action required:**
            1. Run \`./scripts/install.sh\` to download the new server
            2. The EULA hash may have changed — verify the extension still works
            3. Rebuild: \`cargo build --release --target wasm32-wasip2\`
            4. Commit the updated \`extension.wasm\`

            See https://open-vsx.org/extension/JetBrains/intellij-server for details.`,
              labels: ['server-update']
            });
